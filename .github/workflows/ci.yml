name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      # docs/schema_reference.md is generated from the schemas. A stale copy is
      # worse than none, because adopters build against it.
      - name: Schema reference is current
        run: python tools/gen_schema_reference.py --check

      # The conformance suite is the contract offered to other implementations. A
      # stale copy would misrepresent it.
      - name: Conformance suite is current
        run: python tools/gen_conformance.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  conformance-typescript:
    name: Conformance (TypeScript binding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The claim is that the schemas are the artifact and Python is one binding.
      # An independent implementation passing the same vectors is what makes that
      # checkable rather than merely stated.
      - name: Install
        working-directory: bindings/typescript
        run: npm install --no-audit --no-fund

      - name: Run the conformance suite
        working-directory: bindings/typescript
        run: npm run conformance

  acceptance:
    name: Fresh-clone acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The README promises that a fresh clone can install and validate. This job
      # is what keeps that promise honest, since it is the first thing an adopter
      # tries and the first thing that would embarrass the project if it broke.
      - name: Install from a clean checkout
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate the golden files
        run: |
          bead-data validate tests/data/performance_valid.json
          bead-data validate tests/data/performance_valid.csv
          bead-data validate tests/data/location_valid.json
          bead-data validate tests/data/baba_valid.json

      - name: Validate the published examples
        run: |
          if [ -d examples ]; then
            bead-data validate examples/synthetic_field_telemetry.json
            bead-data validate examples/synthetic_factory_export.csv
            bead-data validate examples/synthetic_baba_bundle
            bead-data validate examples/synthetic_locations.json
          else
            echo "examples/ not present yet; skipping"
          fi

      - name: Report and metrics run end to end
        run: |
          bead-data report examples --period 2026-Q3 > /dev/null
          bead-data metrics examples --period 2026-Q3 > /dev/null

      # The full chain a subgrantee would actually run: raw observations in,
      # compliance verdicts and submission files out.
      - name: Raw observations aggregate, report, and submit
        run: |
          bead-data validate examples/synthetic_raw_tests.json --schema test
          bead-data aggregate examples/synthetic_raw_tests.json -o /tmp/derived.json
          bead-data validate /tmp/derived.json --schema performance
          mkdir -p /tmp/chain && cp /tmp/derived.json /tmp/chain/
          bead-data report /tmp/chain --period 2026-Q3 > /dev/null
          bead-data submit examples/synthetic_raw_tests.json -d /tmp/usac
          test -f /tmp/usac/MANIFEST.md
          ls /tmp/usac/*.csv

      - name: Documented invalid example must fail with exit code 1
        run: |
          if [ -f examples/synthetic_factory_export.invalid.csv ]; then
            set +e
            bead-data validate examples/synthetic_factory_export.invalid.csv
            code=$?
            set -e
            if [ "$code" -ne 1 ]; then
              echo "expected exit code 1 from the deliberately invalid example, got $code"
              exit 1
            fi
            echo "deliberately invalid example correctly exited 1"
          else
            echo "invalid example not present yet; skipping"
          fi
