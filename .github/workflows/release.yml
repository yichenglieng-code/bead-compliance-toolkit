name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      # The schemas are normative, and a release that ships without them installs a
      # package that cannot validate anything. Cheap to check, expensive to miss.
      - name: Wheel must contain the normative schemas
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          found = {
              n.split("_schemas/", 1)[1]
              for n in zipfile.ZipFile(wheel).namelist()
              if "_schemas/" in n and n.endswith(".schema.json")
          }
          expected = {
              "baba/v0/baba_evidence.schema.json",
              "common/v0/provenance.schema.json",
              "location/v0/deployment_location.schema.json",
              "performance/v0/performance_fact.schema.json",
              "performance/v0/performance_test.schema.json",
          }
          for name in sorted(found):
              print(name)
          if found != expected:
              sys.exit(
                  f"schema payload mismatch in {wheel}: "
                  f"missing={sorted(expected - found)}, extra={sorted(found - expected)}"
              )
          PY

      - name: Install the wheel in a clean environment and smoke test it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/bead-data --version
          /tmp/verify/bin/python - <<'PY'
          from bead_data.schemas import load_schema, schemas_root
          root = str(schemas_root())
          assert "_schemas" in root, f"schemas resolved outside the package: {root}"
          assert load_schema("performance")["title"] == "Performance Fact"
          print("packaged schemas resolve correctly")
          PY

      - name: Record SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate signed build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/

      - name: Create release with verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag
          --title "$GITHUB_REF_NAME" --notes-from-tag

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/

      - name: Keep only Python distributions in the upload directory
        run: rm dist/SHA256SUMS

      # Trusted publishing: no API token is stored in this repository. Configure the
      # publisher once at pypi.org/manage/account/publishing/ against this repo,
      # workflow file name, and the "pypi" environment.
      - uses: pypa/gh-action-pypi-publish@release/v1
